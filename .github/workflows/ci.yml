name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref — PR pushes are frequent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify base path
        # GitHub Pages serves this repo under /sport-app/. If `base` regresses,
        # the deployed app 404s on its own assets (a blank page) — fail loudly here.
        run: |
          grep -q 'src="/sport-app/assets/' dist/index.html || {
            echo "::error::dist/index.html does not reference /sport-app/ assets — check vite.config.ts base"
            exit 1
          }
