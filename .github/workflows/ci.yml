name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref — PR pushes are frequent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Test build output
        # Reads dist/sw.js to prove skipWaiting is only reachable from the
        # Reload control (issue #18). It skips itself when there is no build, so
        # it has to run *after* this one to mean anything.
        run: npx vitest run e2e/pwa-build.test.ts

      - name: Verify build artefacts
        # GitHub Pages serves this repo under /sport-app/. If `base` regresses,
        # the deployed app 404s on its own assets (a blank page) — fail loudly.
        # The service worker and manifest must exist or the PWA silently isn't one.
        run: |
          grep -q 'src="/sport-app/assets/' dist/index.html || {
            echo "::error::dist/index.html does not reference /sport-app/ assets — check vite.config.ts base"
            exit 1
          }
          test -f dist/manifest.webmanifest || {
            echo "::error::manifest.webmanifest missing"
            exit 1
          }
          test -f dist/sw.js || {
            echo "::error::service worker missing"
            exit 1
          }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npx playwright test

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
